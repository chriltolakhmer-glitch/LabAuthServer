name: LabAuthServer CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test (Release)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.400'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('NuGet.Config', 'Directory.Build.props', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore LabAuthServer.slnx

      - name: Build (Release)
        run: dotnet build LabAuthServer.slnx --configuration Release --no-restore

      - name: Provision disposable SQL audit test database
        shell: pwsh
        run: |
          sqllocaldb start MSSQLLocalDB
          sqlcmd -S "(localdb)\MSSQLLocalDB" -E -b -i database\Phase11\01_CreateDatabase.sql
          sqlcmd -S "(localdb)\MSSQLLocalDB" -E -d LabAuthServer -b -i database\Phase11\02_CreateSchemasTables.sql
          sqlcmd -S "(localdb)\MSSQLLocalDB" -E -d LabAuthServer -b -i database\Phase11\03_CreateAuditProcedures.sql

      - name: Test (Release)
        env:
          LABAUTHSERVER_SQL_AUDIT_TEST_CONNECTION: 'Server=(localdb)\MSSQLLocalDB;Database=LabAuthServer;Integrated Security=True;Encrypt=True;TrustServerCertificate=True;Application Name=LabAuthServer.CI.Tests'
        run: dotnet test LabAuthServer.slnx --configuration Release --no-build --logger "console;verbosity=normal"