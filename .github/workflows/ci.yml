name: LabAuthServer CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test (Release)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.400'

      - name: Cache NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('NuGet.Config', 'Directory.Build.props', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore LabAuthServer.slnx

      - name: Build (Release)
        run: dotnet build LabAuthServer.slnx --configuration Release --no-restore

      - name: Test deterministic boundaries (Release, no SQL or AD)
        shell: pwsh
        run: |
          Remove-Item Env:LABAUTHSERVER_RUN_SQL_TESTS, Env:LABAUTHSERVER_SQL_AUDIT_TEST_CONNECTION, Env:LABAUTHSERVER_RUN_LDAP_ACCEPTANCE -ErrorAction SilentlyContinue
          dotnet test LabAuthServer.slnx --configuration Release --no-build --no-restore --filter "Category!=SqlInfrastructure&Category!=LdapAcceptance" --logger "console;verbosity=normal"

      - name: Provision disposable SQL audit test database
        shell: pwsh
        run: |
          sqllocaldb start MSSQLLocalDB
          sqlcmd -S "(localdb)\MSSQLLocalDB" -E -b -i database\Phase11\01_CreateDatabase.sql
          sqlcmd -S "(localdb)\MSSQLLocalDB" -E -d LabAuthServer -b -i database\Phase11\02_CreateSchemasTables.sql
          sqlcmd -S "(localdb)\MSSQLLocalDB" -E -d LabAuthServer -b -i database\Phase11\03_CreateAuditProcedures.sql

      - name: Test mandatory SQL persistence (Release)
        shell: pwsh
        env:
          LABAUTHSERVER_RUN_SQL_TESTS: '1'
          LABAUTHSERVER_SQL_AUDIT_TEST_CONNECTION: 'Server=(localdb)\MSSQLLocalDB;Database=LabAuthServer;Integrated Security=True;Encrypt=True;TrustServerCertificate=True;Application Name=LabAuthServer.CI.Tests'
        run: |
          if ($env:LABAUTHSERVER_RUN_SQL_TESTS -ne '1' -or [string]::IsNullOrWhiteSpace($env:LABAUTHSERVER_SQL_AUDIT_TEST_CONNECTION)) { throw 'Explicit SQL test enablement and target are required.' }
          $sqlResults = Join-Path $env:RUNNER_TEMP 'LabAuthServer-SqlTests'
          dotnet test tests/LabAuthServer.UnitTests/LabAuthServer.UnitTests.csproj --configuration Release --no-build --no-restore --filter "Category=SqlInfrastructure" --logger "console;verbosity=normal" --logger "trx;LogFileName=sql-infrastructure.trx" --results-directory $sqlResults
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          [xml]$sqlReport = Get-Content -LiteralPath (Join-Path $sqlResults 'sql-infrastructure.trx')
          $counters = $sqlReport.TestRun.ResultSummary.Counters
          if ($counters.total -ne '2' -or $counters.passed -ne '2' -or $counters.executed -ne '2') { throw 'Both mandatory SQL persistence tests must execute and pass; missing/skipped tests fail CI.' }
